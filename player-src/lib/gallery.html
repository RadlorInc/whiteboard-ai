<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Whiteboard library gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e9ecef; font-family: system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 480px); gap: 10px; padding: 10px; }
  figure { margin: 0; background: #fdfdfb; border: 2px solid #b9c0c7; border-radius: 8px; }
  figcaption { font: 13px system-ui; padding: 4px 8px; color: #333; } figcaption.err { color: #c00; font-weight: 700; }
  svg { width: 480px; height: 270px; display: block; } .hand { font-family: Caveat, cursive; } .ink { stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body><div id="grid"></div>
<!-- the defs host recipes.js writes into -->
<svg width="0" height="0" style="position:absolute"><g id="scene"></g></svg>
<script src="../recipes.js"></script>
<script src="wb-load.js"></script>
<script>
// Renders every recipe of one category (?cat=physics) fully drawn and filled, from its catalogue example.
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent?.append(e); return e; }
function parse(spec) { const [head, content] = spec.split('|').map(s => s?.trim()); const parts = head.split(/\s+/), type = parts.shift(); const n = [], o = {};
  for (const p of parts) p.includes('=') ? (o[p.split('=')[0]] = p.split('=')[1]) : n.push(+p); return { type, n, o, content }; }
window.ERRS = [];
(async () => {
  const cat = new URLSearchParams(location.search).get('cat');
  const lines = (await (await fetch(`wb/${cat}.txt`)).text()).split('\n').filter(l => l.trim() && !l.startsWith('#'));
  // every k= variant named in a signature is rendered too (?variants=0 to show only the examples)
  const all = new URLSearchParams(location.search).get('variants') !== '0';
  const items = lines.flatMap(l => { const p = l.split(' | '), sig = p[0], desc = p.at(-1), ex = p.slice(1, -1).join(' | ');
    const ks = all && sig.match(/\bk=([\w|-]+)/)?.[1].split('|').filter(k => !new RegExp(`\\bk=${k}\\b`).test(ex));
    return [[sig, ex, desc], ...(ks || []).map(k => [`${sig.split(/\s/)[0]} k=${k}`, / k=[\w-]+/.test(ex) ? ex.replace(/ k=[\w-]+/, ` k=${k}`) : ex.replace(/^(\S+(?: [-\d.]+)*)/, `$1 k=${k}`), 'variant'])]; });
  for (const [sig, example, desc] of items) {
    const fig = document.createElement('figure'); document.getElementById('grid').append(fig);
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 960 540'); fig.append(svg);
    const cap = document.createElement('figcaption'); fig.append(cap);
    try {
      const { type, n, o, content } = parse(example);
      if (!RECIPES[type]) throw new Error(`no recipe "${type}"`);
      const e = RECIPES[type](n, o, content, svg);
      if (!(e instanceof SVGElement)) throw new Error('recipe did not return an SVG element');
      svg.querySelectorAll('.fillable').forEach(x => x.style.fillOpacity = 1);
      const b = e.getBBox(); if (b.width < 5 || b.height < 5) throw new Error('drew nothing visible');
      if (!svg.querySelector('.ink')) throw new Error('no .ink lines (the player draws .ink lines stroke by stroke)');
      cap.textContent = `${sig} — ${desc}`;
    } catch (err) { cap.className = 'err'; cap.textContent = `${example} → ${err.message}`; ERRS.push(`${example}: ${err.message}`); }
  }
  document.body.dataset.done = '1';
})();
</script>
</body></html>
