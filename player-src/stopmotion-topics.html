<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Motion Topics</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; font-family: system-ui, sans-serif; color: #eee; }
  .wrap { width: min(960px, 100vw - 32px); padding: 16px 0; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #2f7fd6; background: transparent; color: #cfe3ff; cursor: pointer; }
  button.on { background: #2f7fd6; color: #fff; }
  a { color: #8fc1ff; font-size: 14px; }
  canvas { width: 100%; height: auto; display: block; background: #000; }
  #stats { text-align: center; color: #999; font-size: 13px; }
  #caption { min-height: 1.6em; margin: 14px 4px 4px; font-size: 19px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <form class="bar" id="askbar" style="display:none" aria-label="Ask a question">
    <input id="q" placeholder="Ask anything, e.g. Why is the sky blue?" aria-label="Your question" maxlength="500"
      style="flex:1;min-width:0;font-size:16px;padding:8px 14px;border-radius:999px;border:1px solid #2f7fd6;background:#1b1b1b;color:#eee">
    <button id="ask" class="on">Ask</button>
  </form>
  <div class="bar" id="topics"></div>
  <div class="bar" id="modes"></div>
  <div class="bar"><label><input type="checkbox" id="voice" checked> Voice</label>
    <span>The same six answers as the <a href="index.html">Whiteboard</a>, in the stop-motion style. No character, nothing written inside the frame.</span></div>
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="caption"></div>
  <div id="stats"></div>
</div>
<script src="styles-lib.js"></script>
<script src="stopmotion-answers.js"></script>
<script>
const cv = document.getElementById('cv'), cx = cv.getContext('2d'), K = makeKit(cx);
const { poly, circ, rrect } = K;
// ---------- stop-motion helpers: every outline sits a hair differently each drawing (the boil), 12 drawings a second
let BOIL = true, NOW = 0;                // BOIL off = paper motion (no wobble); NOW = the scene's clock, for things that turn
const jig = (f, i, a = 1.6) => { if (!BOIL) return 0; const r = rng(f % 3 * 97 + i); return (r() - .5) * a; };
let BG = '#ebe8e2';                      // each scene's full-frame colour (set per scene by the player), like the original's navy / purple / peach
const paper = (col = BG) => { cx.fillStyle = col; cx.fillRect(-600, -600, 2200, 1800); };
const ground = (y = 470) => { cx.strokeStyle = '#bdb8ae'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(60, y); cx.lineTo(900, y); cx.stroke(); };
const soft = list => { cx.save(); cx.filter = 'blur(40px)'; cx.globalAlpha = .5; list.forEach(([x, y, r, c]) => circ(x, y, r, c)); cx.restore(); };
const blob = (x, y, rx, ry, f, i, fill, edge, lw = 3, n = 28, w = 4) => { const pts = [];
  for (let a = 0; a < n; a++) { const an = a / n * TAU, k = 1 + jig(f, i * 31 + a, w / Math.max(rx, 1)); pts.push([x + Math.cos(an) * rx * k, y + Math.sin(an) * ry * k]); }
  poly(pts, fill, edge, lw); };
function sun(x, y, r, f) { cx.save(); cx.translate(x, y); cx.rotate(NOW * .25);
  for (let i = 0; i < 12; i++) { cx.rotate(TAU / 12); poly([[r + 10, -9], [r + 34 + jig(f, i, 5), 0], [r + 10, 9]], '#f6d65a', '#c98a1a', 2.5); }
  cx.restore(); blob(x, y, r, r, f, 1, '#f6d65a', '#c98a1a', 3.5); circ(x - r * .3, y - r * .3, r * .22, 'rgba(255,255,255,.45)'); }
function cloud(x, y, s, f, fill = '#f6f4f0', edge = '#8a93a6', n = 5) { const P = [[-70, 10, 42], [-30, -18, 52], [22, -24, 56], [64, 4, 44], [0, 20, 48], [-100, 26, 30], [96, 28, 30]].slice(0, n + 2);
  cx.save(); cx.translate(x, y); cx.scale(s, s); P.forEach(([px, py, r], i) => circ(px + jig(f, i), py + jig(f, i + 9), r, null, edge, 6)); P.forEach(([px, py, r], i) => circ(px + jig(f, i), py + jig(f, i + 9), r, fill)); cx.restore(); }
const lenOf = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
function along(pts, u) { let d = clamp(u) * lenOf(pts);
  for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (d <= L || i === pts.length - 1) { const k = L ? Math.min(1, d / L) : 0; return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; } d -= L; } }
function upto(pts, k) { const out = [pts[0]]; let d = clamp(k) * lenOf(pts);
  for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (d >= L) { out.push(pts[i]); d -= L; } else { out.push(along([pts[i - 1], pts[i]], L ? d / L : 0)); break; } } return out; }
function path(pts, col, w, { dash, f = 0, glow, alpha = 1 } = {}) { if (pts.length < 2) return; cx.save(); cx.globalAlpha *= alpha; cx.strokeStyle = col; cx.lineWidth = w; cx.lineCap = cx.lineJoin = 'round';
  if (dash) { cx.setLineDash(dash); cx.lineDashOffset = -f * 3; } if (glow) { cx.shadowColor = glow; cx.shadowBlur = 12; }
  cx.beginPath(); pts.forEach(([x, y], i) => i ? cx.lineTo(x, y) : cx.moveTo(x, y)); cx.stroke(); cx.restore(); }
function arrowHead(pts, col, s = 12) { const n = pts.length; if (n < 2) return; const [a, b] = [pts[n - 2], pts[n - 1]], an = Math.atan2(b[1] - a[1], b[0] - a[0]);
  cx.save(); cx.translate(b[0], b[1]); cx.rotate(an); poly([[s, 0], [-s * .7, -s * .7], [-s * .7, s * .7]], col); cx.restore(); }
const RAIN = ['#e05a4f', '#f29a52', '#f6d65a', '#6fbf73', '#4fa3d8', '#5d6fd0', '#9f74c0'];

// ---------- 1. rainbow
const DROP = [520, 300, 200], P0 = [520 - Math.sqrt(200 ** 2 - 100 ** 2), 200];
const onDrop = a => [DROP[0] + Math.cos(a) * DROP[2], DROP[1] + Math.sin(a) * DROP[2]];
function bigDrop(f, legs) {                         // legs: how far each of the three legs of light has gone (0..1)
  paper(); soft([[300, 160, 180, '#9fc4e6'], [760, 460, 170, '#9f74c0']]);
  blob(DROP[0], DROP[1], DROP[2], DROP[2], f, 3, 'rgba(173,214,240,.55)', '#5b8fb8', 5, 48, 3); circ(450, 220, 26, 'rgba(255,255,255,.6)');
  path([[-20, 200], P0], '#ffffff', 16, { glow: '#ffffff' }); path([[-20, 200], P0], '#c9c4ba', 2);
  RAIN.forEach((c, i) => { const B = onDrop(-.12 + i * .045), E = onDrop(2.05 + i * .06), out = add2(E, 2.55 + i * .07, 330);
    path(upto([P0, B], legs[0]), c, 5); if (legs[1] > 0) path(upto([B, E], legs[1]), c, 5); if (legs[2] > 0) path(upto([E, out], legs[2]), c, 9); }); }
const add2 = (p, a, L) => [p[0] + Math.cos(a) * L, p[1] + Math.sin(a) * L];
function rainbowArc(cx0, cy0, r0, k, f, band = 16) { RAIN.forEach((c, i) => { cx.strokeStyle = c; cx.lineWidth = band + 1; cx.beginPath(); cx.arc(cx0 + jig(f, i, 1), cy0, r0 - i * band, Math.PI, Math.PI + Math.PI * clamp(k)); cx.stroke(); }); }
const rainbow = {
  q: 'How does a rainbow form?', bgs: ['#ebe8e2', '#1d2147', '#2c3566', '#2c3566', '#2c3566', '#f3b49b', '#ebe8e2'],
  lines: ['A rainbow needs two things: sunlight, and raindrops in the air.', 'Sunlight looks white, but it is really a mix of every colour.',
    'When light enters a raindrop, it bends, and each colour bends a little differently.', 'Then it bounces off the back of the drop.',
    'And it comes out spread into a fan of colours.', 'Millions of drops do this at the same time, so we see a giant arc of colour.',
    'That is why a rainbow appears when the sun is behind you and the rain is in front of you.'],
  scenes: [
    (t, f) => { paper(); soft([[220, 180, 170, '#f6d65a'], [740, 170, 180, '#9fb4d8']]); ground();
      sun(230, 210, 70 * ease(t / .6), f); if (t > .8) { cloud(720, 190, 1.15, f, '#dfe3ea'); for (let i = 0; i < 16; i++) { const x = 620 + (i * 53) % 210, y = 260 + ((i * 41 + t * 260) % 200);
        path([[x, y], [x - 4, y + 16]], '#5b8fb8', 3); } } },
    (t, f) => { paper(); soft([[480, 300, 220, '#f3e3b0']]); const k = ease(t / 1.2), r = ease((t - 1.6) / 2.2);
      rrect(-20, 262, 1000 * k, 76, 10, '#ffffff', '#c9c4ba', 3);
      cx.save(); cx.beginPath(); cx.rect(-20, 262, 1000 * r, 76); cx.clip(); RAIN.forEach((c, i) => { const sp = r * 6; rrect(-20, 266 + i * 10 - (3 - i) * sp, 1000, 10, 2, c); }); cx.restore(); },
    (t, f) => bigDrop(f, [ease(t / 2.2), 0, 0]),
    (t, f) => { bigDrop(f, [1, ease(t / 1.4), 0]); if (t > 1.3 && t < 2.2) RAIN.forEach((c, i) => circ(...onDrop(-.12 + i * .045), 7, '#ffffff')); },
    (t, f) => bigDrop(f, [1, 1, ease(t / 1.6)]),
    (t, f) => { paper(); soft([[480, 120, 220, '#9fb4d8'], [800, 420, 160, '#f3b49b']]); blob(480, 640, 620, 170, f, 5, '#7cbf7c', '#3c7a46', 3);
      const r = rng(4); for (let i = 0; i < 70; i++) circ(80 + r() * 800, 60 + r() * 380 + (t * 120 + r() * 60) % 40, 3, 'rgba(91,143,184,.6)');
      rainbowArc(480, 560, 400, ease(t / 3), f, 18); },
    (t, f) => { paper(); soft([[120, 360, 170, '#f6d65a'], [760, 200, 200, '#9fb4d8']]); ground(500);
      sun(110, 380, 50, f); cloud(740, 150, 1, f, '#dfe3ea'); for (let i = 0; i < 12; i++) { const x = 650 + (i * 47) % 200, y = 210 + ((i * 41 + t * 260) % 160); path([[x, y], [x - 4, y + 14]], '#5b8fb8', 3); }
      rainbowArc(700, 500, 230, 1, f, 12);
      cx.save(); cx.translate(420, 430); cx.beginPath(); cx.moveTo(-50, 0); cx.quadraticCurveTo(0, -36, 50, 0); cx.quadraticCurveTo(0, 36, -50, 0); cx.fillStyle = '#fff'; cx.fill(); cx.strokeStyle = '#2a1a12'; cx.lineWidth = 4; cx.stroke();
      circ(16, 0, 17, '#4fa3d8', '#2a1a12', 3); circ(18, 0, 8, '#2a1a12'); cx.restore();              // you, looking at the rain
      const k = ease((t - .8) / 2.4); path(upto([[150, 380], [380, 360], [690, 270], [480, 425]], k), '#f0b429', 4, { dash: [12, 10], f }); }],
};

// ---------- 2. compound interest (one coin = ten dollars; gold = what you put in, green = interest, pink = interest on interest)
const GOLD = ['#f2c230', '#8a6414'], GREEN = ['#7cc47f', '#2f6b3a'], PINK = ['#f07aa0', '#8a2f4f'];
const coin = (x, y, f, i, [fill, edge], w = 70, h = 16) => { rrect(x - w / 2 + jig(f, i, 1.5), y - h / 2, w, h, h / 2, fill, edge, 2.5); cx.strokeStyle = 'rgba(255,255,255,.45)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x - w / 2 + 10, y - 3); cx.lineTo(x + w / 2 - 10, y - 3); cx.stroke(); };
function stack(x, base, n, f, colOf = () => GOLD, h = 16, w = 70) { const whole = Math.floor(n), part = n - whole;
  for (let i = 0; i < whole; i++) coin(x, base - i * (h - 2) - h / 2, f, x + i, colOf(i), w, h);
  if (part > .05) { cx.save(); cx.beginPath(); cx.rect(x - w, base - whole * (h - 2) - h, w * 2, h); cx.clip(); coin(x, base - whole * (h - 2) - h / 2, f, x + whole, colOf(whole), w * part + 12, h); cx.restore(); } }
function jar(x, base, f) { cx.save(); cx.globalAlpha = .9; rrect(x - 70, base - 250, 140, 252, 22, 'rgba(200,226,240,.35)', '#7aa6c2', 4); rrect(x - 78, base - 268, 156, 22, 8, '#c9c4ba', '#7a7466', 3); cx.restore(); }
function yearSun(t, d) { const u = clamp(t / d); sunSmall(lerp(160, 800, u), 120 - Math.sin(u * Math.PI) * 60); }
const sunSmall = (x, y) => { circ(x, y, 26, '#f6d65a', '#c98a1a', 3); };
const compound = {
  q: 'What is compound interest?', bgs: ['#ebe8e2', '#2c3566', '#4b2f74', '#4b2f74', '#1d2147', '#ebe8e2'],
  lines: ['Compound interest means you earn interest on your interest, too.', 'Say you put one hundred dollars in a bank that pays ten percent a year.',
    'After one year you earn ten dollars, so you have one hundred and ten.', 'The next year, ten percent of one hundred and ten is eleven dollars, not ten. Your interest earned interest.',
    'Keep going, and the growth speeds up. After ten years you have about two hundred and fifty nine dollars.', 'With simple interest you would only have two hundred. The extra fifty nine dollars is interest on interest.'],
  scenes: [
    (t, f) => { paper(); soft([[300, 300, 200, '#f6d65a'], [700, 260, 180, '#f07aa0']]);
      const g = (x, y, r, [fill, edge], k, i) => { if (k <= 0) return; blob(x, y, r * k, r * k, f, i, fill, edge, 4, 32, 3); circ(x, y, r * k * .7, null, edge, 2); };
      g(330, 330, 120, GOLD, ease(t / .6), 1); path(upto([[400, 260], [520, 200]], ease((t - .8) / .5)), '#3c7a46', 5);
      g(575, 190, 62, GREEN, ease((t - 1.2) / .5), 2); path(upto([[615, 150], [690, 110]], ease((t - 2) / .4)), '#8a2f4f', 4); g(715, 98, 30, PINK, ease((t - 2.3) / .5), 3); },
    (t, f) => { paper(); soft([[700, 260, 220, '#9fb4d8']]); ground(500);
      poly([[600, 230], [800, 160], [1000, 230]], '#2f3566', '#1a1d40', 3); rrect(620, 230, 360, 270, 4, '#f4ead8', '#a88a55', 3);
      for (let i = 0; i < 4; i++) rrect(650 + i * 82, 260, 26, 240, 4, '#e2d4b8', '#a88a55', 2);
      jar(380, 500, f); stack(380, 494, Math.min(10, Math.floor(t / .22)), f);
      cx.save(); cx.translate(520, 190); circ(0, 0, 48, '#f4ead8', '#a88a55', 3); cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, 48, -Math.PI / 2, -Math.PI / 2 + TAU / 10); cx.closePath(); cx.fillStyle = '#7cc47f'; cx.fill(); cx.strokeStyle = '#2f6b3a'; cx.lineWidth = 2.5; cx.stroke(); cx.restore(); },
    (t, f, d) => { paper(); soft([[480, 300, 220, '#f6d65a']]); ground(500); yearSun(t, d * .55);
      jar(480, 500, f); const drop = clamp((t - d * .6) / .5); stack(480, 494, 10, f);
      if (drop > 0) coin(480, lerp(140, 494 - 10 * 14 - 8, ease(drop)), f, 99, GREEN); },
    (t, f, d) => { paper(); soft([[480, 300, 220, '#f07aa0']]); ground(500); yearSun(t, d * .4);
      jar(480, 500, f); stack(480, 494, 11, f, i => i === 10 ? GREEN : GOLD);
      const drop = clamp((t - d * .45) / .5), top = 494 - 11 * 14 - 8, y = lerp(140, top, ease(drop));
      if (drop > 0) { coin(480, y, f, 98, GREEN); cx.save(); if (t > d * .62) { cx.shadowColor = '#f07aa0'; cx.shadowBlur = 16 + 8 * Math.sin(f); } rrect(446, y - 22, 68, 9, 4, PINK[0], PINK[1], 2.5); cx.restore(); } },
    (t, f, d) => { paper(); soft([[700, 200, 220, '#f6d65a'], [250, 420, 180, '#7cc47f']]); ground(520);
      const shown = Math.min(11, Math.floor(t / (d * .7) * 11) + 1), H = 9, tops = [];
      for (let n = 0; n < shown; n++) { const v = 10 * 1.1 ** n, x = 110 + n * 74; stack(x, 520, v, f, i => i < 10 ? GOLD : i < 10 + n ? GREEN : PINK, H + 2, 54); tops.push([x, 520 - v * H - 6]); }
      path(tops, '#f07aa0', 4, { glow: '#f07aa0' }); },
    (t, f) => { paper(); soft([[360, 300, 200, '#9fb4d8'], [620, 260, 200, '#f07aa0']]); ground(540);
      stack(360, 540, 20, f, i => i < 10 ? GOLD : ['#9fb4d8', '#4a5f88'], 16, 120);
      cx.save(); const pulse = .5 + .5 * Math.sin(t * 7);
      stack(620, 540, 25.9, f, i => i < 10 ? GOLD : i < 20 ? GREEN : PINK, 16, 120);
      cx.globalAlpha = .25 + .35 * pulse; cx.shadowColor = '#f07aa0'; cx.shadowBlur = 24; rrect(552, 540 - 25.9 * 14 - 6, 136, 6 * 14 + 6, 10, null, '#f07aa0', 5); cx.restore();
      path([[300, 540 - 20 * 14 - 4], [700, 540 - 20 * 14 - 4]], '#4a5f88', 2.5, { dash: [10, 8] }); }],
};

// ---------- 3. internet
const PK = ['#e05a4f', '#f29a52', '#4fa3d8', '#6fbf73', '#9f74c0'];
function laptop(x, y, s, f) { cx.save(); cx.translate(x + jig(f, 1), y + jig(f, 2)); cx.scale(s, s); rrect(-80, -110, 160, 104, 8, '#2f3566', '#1a1d40', 3); rrect(-68, -98, 136, 80, 4, '#9fc4e6'); poly([[-100, 0], [100, 0], [86, -10], [-86, -10]], '#c9c4ba', '#7a7466', 3); cx.restore(); }
function phone(x, y, s, f) { cx.save(); cx.translate(x + jig(f, 3), y + jig(f, 4)); cx.scale(s, s); rrect(-42, -78, 84, 156, 14, '#2f3566', '#1a1d40', 3); rrect(-34, -64, 68, 124, 6, '#d8ecf7'); circ(0, 68, 4, '#9aa0aa'); cx.restore(); }
function envelope(x, y, w, h, f, open = 0) { rrect(x - w / 2 + jig(f, 5), y - h / 2, w, h, 6, '#ffffff', '#7a7466', 3);
  path([[x - w / 2 + 4, y - h / 2 + 4], [x, y + (open ? -h * 1.1 * open : h * .15)], [x + w / 2 - 4, y - h / 2 + 4]], '#7a7466', 3); }
function packet(x, y, n, f, s = 1) { cx.save(); cx.translate(x + jig(f, n * 7, 2), y + jig(f, n * 11, 2)); cx.scale(s, s); rrect(-26, -19, 52, 38, 6, '#ffffff', PK[n - 1], 4);
  for (let i = 0; i < n; i++) circ(-16 + (i % 3) * 16, n > 3 ? (i < 3 ? -7 : 7) : 0, 5, PK[n - 1]); cx.restore(); }
const NODES = [[110, 300], [300, 160], [300, 440], [480, 300], [660, 150], [660, 450], [850, 300]];
const LINKS = [[0, 1], [0, 2], [1, 3], [2, 3], [1, 4], [3, 4], [3, 5], [2, 5], [4, 6], [5, 6]];
function network(f, t) { paper(); soft([[480, 300, 260, '#9fc4e6']]);
  LINKS.forEach(([a, b]) => path([NODES[a], NODES[b]], '#c9cde6', 4, { dash: [10, 8], alpha: .7 }));
  NODES.slice(1, 6).forEach(([x, y], i) => { rrect(x - 30 + jig(f, i), y - 18, 60, 36, 8, '#e9eef7', '#8a93a6', 3); path([[x - 16, y - 18], [x - 22, y - 36]], '#c9cde6', 3); path([[x + 16, y - 18], [x + 22, y - 36]], '#c9cde6', 3);
    circ(x + 18, y, 5, (Math.floor(t * 6) + i) % 2 ? '#7cc47f' : '#2f6b3a'); });
  laptop(NODES[0][0] - 10, NODES[0][1] + 50, .55, f); phone(NODES[6][0] + 20, NODES[6][1], .6, f); }
const ROUTES = [[0, 1, 4, 6], [0, 2, 5, 6], [0, 1, 3, 4, 6], [0, 2, 3, 5, 6], [0, 1, 3, 5, 6]].map(r => r.map(i => NODES[i]));
const internet = {
  q: 'How does the internet send a message?', bgs: ['#ebe8e2', '#f3b49b', '#1d2147', '#1d2147', '#4b2f74', '#ebe8e2'],
  lines: ['When you send a message, your computer does not send it in one piece.', 'First it cuts the message into small numbered pieces, called packets.',
    "Each packet hops through routers, which pass it toward your friend's address.", 'Packets can take different roads, so they may arrive in any order.',
    "Your friend's phone puts them back in order using the numbers, and the message appears.", 'All of this happens in less than a second!'],
  scenes: [
    (t, f) => { paper(); soft([[250, 300, 180, '#9fc4e6'], [760, 300, 180, '#f3b49b']]); ground(470);
      laptop(250, 470, 1.4, f); phone(760, 360, 1.3, f); path([[340, 300], [690, 300]], '#c9c4ba', 3, { dash: [12, 10] });
      const k = ease(clamp((t - .6) / .8)), shake = t > 1.5 && t < 2.6 ? Math.sin(t * 40) * 6 : 0, x = lerp(250, 400, k) + shake; envelope(x, 330, 110, 70, f);
      if (t > 2.6) for (let i = 1; i < 5; i++) path([[x - 55 + i * 22, 292], [x - 55 + i * 22, 368]], '#e05a4f', 3, { dash: [6, 6] }); },
    (t, f) => { paper(); soft([[480, 300, 240, '#f3e3b0']]); const k = ease((t - .5) / 1.5);
      cx.save(); cx.globalAlpha = 1 - k; envelope(480, 300, 320, 200, f); cx.restore();
      for (let n = 1; n <= 5; n++) { const x0 = 480 - 128 + (n - 1) * 64, x1 = 140 + (n - 1) * 170; packet(lerp(x0, x1, k), 300 + (n % 2 ? -1 : 1) * 40 * k, n, f, lerp(.9, 1.6, k)); } },
    (t, f) => { network(f, t); const u = clamp(t / 4); packet(...along(ROUTES[0], u), 1, f, 1.1); },
    (t, f) => { network(f, t); const arrive = { 3: 1.9, 1: 2.5, 5: 3.0, 2: 3.5, 4: 4.0 }, order = [3, 1, 5, 2, 4];
      for (let n = 1; n <= 5; n++) { const s = .1 + n * .05, u = clamp((t - s) / (arrive[n] - s)); if (u < 1) packet(...along(ROUTES[n - 1], u), n, f, 1);

  TOPICS['saved' + i] = fromRecipe(s.answer); addTopic('saved' + i).textContent = '▶ ★ ' + s.answer.q; }));

// Ask anything: only when served by server.mjs (python http.server has no /api)
fetch('api/health').then(r => r.ok && r.json()).then(h => { if (h) document.getElementById('askbar').style.display = 'flex'; }).catch(() => {});
document.getElementById('askbar').onsubmit = async e => {
  e.preventDefault();
  const qEl = document.getElementById('q'), ask = document.getElementById('ask'), question = qEl.value.trim(); if (!question) return;
  ask.disabled = true; const t0 = Date.now();
  const tick = setInterval(() => caption.textContent = `Making your lesson… ${Math.round((Date.now() - t0) / 1000)} s`, 500);
  try {
    const r = await fetch('api/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question, style: 'paper' }) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error);
    const key = 'ask' + Object.keys(TOPICS).length;
    TOPICS[key] = fromRecipe({ ...out.answer, q: out.answer.q || question });
    clearInterval(tick); current = key; const b = addTopic(key); b.click();
    document.getElementById('stats').textContent += out.usage[0]?.mock ? ' · MOCK: a hand-made answer, no API call'
      : ` · made in ${(out.ms / 1000).toFixed(1)} s, ${out.attempts} attempt(s), cost $${out.cost.toFixed(4)}`;
  } catch (err) { clearInterval(tick); caption.textContent = '⚠️ ' + err.message; }
  ask.disabled = false;
};
</script>

<script>
// ?gallery=<cat> : every drawing of one paper-library category as a still, in a grid (render check: node lib/shot.mjs paper <cat>)
(async () => {
  const cat = new URLSearchParams(location.search).get('gallery'); if (!cat) return;
  window.ERRS = []; MODE = 'paper'; BOIL = false;
  const lines = (await (await fetch(`lib/paper/${cat}.txt`)).text()).split('\n').filter(l => l.trim() && !l.startsWith('#'))
    .flatMap(l => { const p = l.split(' | '), sig = p[0], ex = p.slice(1, -1).join(' | '), desc = p.at(-1);    // every k= variant too
      const ks = sig.match(/\bk=([\w|-]+)/)?.[1].split('|').filter(k => !new RegExp(`\\bk=${k}\\b`).test(ex)) || [];
      return [l, ...ks.map(k => `${sig.split(/\s/)[0]} k=${k} | ${/ k=[\w-]+/.test(ex) ? ex.replace(/ k=[\w-]+/, ` k=${k}`) : ex + ` k=${k}`} | variant`)]; });
  const G = Object.assign(document.createElement('canvas'), { id: 'gallery', width: 4 * 480, height: Math.ceil(lines.length / 4) * 330 }), g = G.getContext('2d');
  document.querySelector('.wrap').style.width = '1940px'; document.querySelector('.wrap').append(G);
  g.fillStyle = '#222'; g.fillRect(0, 0, G.width, G.height); g.font = '14px system-ui';
  lines.forEach((l, i) => { const p = l.split(' | '), sig = p[0], example = p.slice(1, -1).join(' | '), x = (i % 4) * 480, y = Math.floor(i / 4) * 330;
    try { TOPICS.__g = fromRecipe({ q: 'g', steps: [{ say: 'g', bg: '#cfd8e3', do: [example] }] }); CMDS.clear(); frame(TOPICS.__g, 0, 1.5);
      g.drawImage(cv, x, y, 480, 300); g.fillStyle = '#eee'; g.fillText(sig.slice(0, 64), x + 6, y + 320);
    } catch (err) { ERRS.push(`${example}: ${err.message}`); g.fillStyle = '#f66'; g.fillText(`${example} → ${err.message}`.slice(0, 70), x + 6, y + 160); } });
  document.body.dataset.done = '1';
})();
</script>
