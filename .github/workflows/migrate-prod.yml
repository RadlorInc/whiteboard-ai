# Apply supabase/migrations to the production database (PLAN.md §12.7). Manual only, and the `production-db`
# environment requires the founder's approval for every run. Never seeds: seed.sql holds test users with credits.
# Needs environment secrets: SUPABASE_ACCESS_TOKEN (a personal access token) and SUPABASE_DB_PASSWORD.
name: migrate-prod
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the production project ref to confirm'
        required: true
permissions:
  contents: read
concurrency:
  group: migrate-prod
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Assert the target is the production project written in the repo
        run: |
          REF="$(cat supabase/prod-ref)"
          test "$REF" = "dsmffdrdeqzqatxplfty" || { echo "supabase/prod-ref changed: refusing"; exit 1; }
          test "${{ inputs.confirm }}" = "$REF" || { echo "confirmation does not match supabase/prod-ref"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD" || { echo "missing environment secrets"; exit 1; }
      - run: supabase link --project-ref "$(cat supabase/prod-ref)" --password "$SUPABASE_DB_PASSWORD"
      - name: Show what will be applied
        run: supabase migration list
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Show the ledger after
        run: supabase migration list
