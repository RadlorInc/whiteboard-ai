# Every PR and every push to main: types, lint, secret scan, unit + local-DB tests, pgTAP, e2e (mock model: never spends).
# Inert until the private GitHub repo exists (PLAN.md E2); make "ci" a required check so a red PR cannot merge.
name: ci
# push only on main: a PR already runs on pull_request, and a second identical run doubled the waits and downloads.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      - run: npm ci
      - run: npx next typegen          # PageProps / LayoutProps come from Next's generated .next/types
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run lint:secrets
      - run: node scripts/wb-index.mjs --check     # the lazy library's index (lib/wb-index.js) matches the category files
      - run: supabase start
      - name: Local env (local stack keys only; no real secrets in CI)
        run: |
          supabase status -o env | awk -F= '
            /^API_URL=/{gsub(/"/,"",$2); print "NEXT_PUBLIC_SUPABASE_URL="$2}
            /^ANON_KEY=/{v=substr($0,index($0,"=")+1); gsub(/"/,"",v); print "NEXT_PUBLIC_SUPABASE_ANON_KEY="v}
            /^SERVICE_ROLE_KEY=/{v=substr($0,index($0,"=")+1); gsub(/"/,"",v); print "SUPABASE_SERVICE_ROLE_KEY="v}' > .env.local
          echo "APP_URL=http://localhost:3100" >> .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100" >> .env.local
          echo "CRON_SECRET=ci-$(openssl rand -hex 16)" >> .env.local
          echo "AGE_COOKIE_KEY=$(openssl rand -hex 32)" >> .env.local
          echo "RATE_LIMIT_HMAC_KEY=$(openssl rand -hex 32)" >> .env.local
      - run: supabase test db
      - run: npx vitest run
      - run: WB_LOCAL_DB=1 npx vitest run tests/billing tests/db tests/generation/localdb.test.ts
      # The install hung for 10-30 min several times (22 Oct 2026): apt stalls on a slow Ubuntu mirror. apt gets its own
      # timeout and retries; each try gets 4 minutes, and a stuck apt is killed before the next one (it holds the lock).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the e2e browsers
        timeout-minutes: 13
        run: |
          # The runner's own mirror (azure.archive.ubuntu.com) crawled at ~50 kB/s on 22 Oct 2026: use Ubuntu's main one.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ci-net
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium webkit && exit 0
            echo "playwright install try $i failed or hung; retrying"
            sudo pkill -f apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1
      # The player on its own (static files, no server): the lazy library builds every example from its own category,
      # and a sample of Anatomy recipes (the split builds, WebGL ones, a how-to) load, draw and fit their box. The full
      # 276 take ~15 minutes: `node scripts/player-check.mjs iso` before an Anatomy release (workshop export).
      - run: node scripts/player-check.mjs lazy
      - run: node scripts/player-check.mjs iso lever,tyrechange,handwash,cpr,kettle,bpcuff,bunsen,rocket,heartsection,powerline,fridge,circular
      - run: node scripts/player-check.mjs lite
      - run: node scripts/player-check.mjs iso bunsen,kettle,rocket,lamp,lever --browser webkit
      - run: CI=1 npx playwright test
      - name: Keep the e2e evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-results, path: test-results/, retention-days: 7 }
